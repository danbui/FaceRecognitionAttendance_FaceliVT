<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập – Edge Attendance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colors */
            --color-ember-orange: #f53900;
            --color-pale-peach: #ffe0d6;
            --color-midnight-charcoal: #040101;
            --color-canvas-white: #fffafa;
            --color-border-fog: #e5e5e5;
            --color-muted-ash: #827e7e;
            --color-divider-gray: #c0bcbc;

            /* Typography */
            --font-geist: 'Outfit', 'Geist', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            
            /* Border Radius */
            --radius-cards: 8px;
            --radius-buttons: 6px;
            --radius-inputs: 6px;
            
            /* Shadows */
            --shadow-subtle: rgba(0, 0, 0, 0.05) 0px 1px 2px 0px;
            --shadow-card: 0 10px 30px -10px rgba(4, 1, 1, 0.08), 0 1px 3px rgba(4, 1, 1, 0.02);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: var(--font-geist);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-canvas-white);
            background-image: 
                radial-gradient(at 0% 0%, rgba(245, 57, 0, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 57, 0, 0.02) 0px, transparent 50%);
            color: var(--color-midnight-charcoal);
            padding: var(--spacing-24, 24px);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 16px;
        }

        .login-card {
            background: var(--color-canvas-white);
            border: 1px solid var(--color-border-fog);
            border-radius: var(--radius-cards);
            padding: 48px 40px;
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }

        /* Top accent line */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--color-ember-orange);
        }

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: var(--color-pale-peach);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--color-ember-orange);
            margin-bottom: 16px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-midnight-charcoal);
            letter-spacing: -0.5px;
        }

        .logo p {
            font-size: 14px;
            color: var(--color-muted-ash);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--color-midnight-charcoal);
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--color-canvas-white);
            border: 1px solid var(--color-border-fog);
            border-radius: var(--radius-inputs);
            color: var(--color-midnight-charcoal);
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--color-ember-orange);
            box-shadow: 0 0 0 3px rgba(245, 57, 0, 0.12);
        }

        input::placeholder {
            color: var(--color-muted-ash);
            opacity: 0.6;
        }

        .btn-login {
            width: 100%;
            padding: 12px 40px;
            background: var(--color-ember-orange);
            color: var(--color-canvas-white);
            border: none;
            border-radius: var(--radius-buttons);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            text-align: center;
        }

        .btn-login:hover {
            opacity: 0.95;
            box-shadow: 0 4px 12px rgba(245, 57, 0, 0.15);
        }

        .btn-login:active {
            transform: translateY(1px);
        }

        .error-msg {
            background: #fff0ec;
            border: 1px solid rgba(245, 57, 0, 0.2);
            color: var(--color-ember-orange);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 24px;
            text-align: center;
            font-weight: 500;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            font-size: 12px;
            color: var(--color-muted-ash);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <h1>Edge Attendance</h1>
                <p>Hệ thống điểm danh khuôn mặt</p>
            </div>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
                </div>
                <button type="submit" class="btn-login">Đăng nhập</button>
            </form>

            <div class="footer">
                Edge Attendance System &copy; 2026
            </div>
        </div>
    </div>
</body>
</html>
